[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "一个支持多 Provider 的命令行 AI 对话助手。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
