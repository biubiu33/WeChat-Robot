hooks:
  - name: block-direct-json-write
    event: PreToolUse
    if:
      all_of:
        - field: tool_name
          match:
            type: regex
            value: "^(write_file|edit_file)$"
        - field: tool_input.path
          match:
            type: regex
            value: "(?i).*\\.json$"
    action:
      type: shell
      command: "echo 请使用对应的生成命令或专用配置流程，不要直接修改 JSON 文件 >&2; exit 2"