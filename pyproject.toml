[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "Claude Code 风格的多协议终端 LLM 对话客户端。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
    "mcp>=1.0",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[tool.hatch.build.targets.wheel.force-include]
"src/mewcode/skill/builtin" = "mewcode/skill/builtin"
"src/mewcode/subagent/builtin" = "mewcode/subagent/builtin"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
