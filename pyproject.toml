[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "Claude Code 风格的多协议终端 LLM 对话客户端。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
    "mcp>=1.0",
]

[project.scripts]
mewcode = "mewcode.cli:main"
mewcode-wechat = "mewcode.wechat.cli:main"

[project.optional-dependencies]
wechat = [
    "uiautomation>=2.0.29,<3",
    "pywin32>=312",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.23.1,<2",
    "pillow>=10",
    "numpy>=2,<3",
    "timezonefinder>=6.5,<9",
    "tzdata>=2024.1",
    "tzlocal>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
